# Raspa as métricas OTel que o collector expõe (ADR 0018).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertas como código; teste em docker/prometheus/tests (promtool test rules).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

# Stack de produção (ADR 0019 e 0020), independente do compose de desenvolvimento.
#
#   cp .env.prod.example .env.prod   # preencha os obrigatórios
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Uma imagem para api, worker, mock-store e os jobs (migrate, seed); os tópicos são criados com
# KAFKA_PARTITIONS partições antes da aplicação (a chave conversation_id mantém a ordem por
# conversa) e o worker roda com WORKER_REPLICAS réplicas no mesmo grupo de consumo.
# Postgres, Redpanda e o collector ficam só na rede interna; no host: API, Grafana, Jaeger e
# Prometheus. Nenhum segredo neste arquivo: os obrigatórios falham com `:?` se faltarem.

name: commerce-agents-prod

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/cainan-bn/commerce-agents:latest}
  build: .
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-commerce}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-commerce}
    KAFKA_BOOTSTRAP: redpanda:9092
    STORE_BASE_URL: http://mock-store:8001
    WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?defina WEB_SESSION_SECRET}
    PANEL_TOKEN: ${PANEL_TOKEN:?defina PANEL_TOKEN}
    DEMO_MODE: ${DEMO_MODE:-false}
    # Opcionais sem valor: só entram no container se definidos (vazio seria valor inválido).
    LLM_PROVIDER:
    LLM_MODEL:
    LLM_BASE_URL:
    LLM_API_KEY:
    # Cassete da demonstração (ADR 0020), lido só com LLM_PROVIDER=recorded.
    LLM_CASSETTE: ${LLM_CASSETTE:-/app/data/demo/cassette.jsonl}
    LLM_MAX_RETRIES:
    LLM_TIMEOUT_S:
    LLM_FALLBACK_PROVIDER:
    LLM_FALLBACK_MODEL:
    LLM_FALLBACK_BASE_URL:
    LLM_FALLBACK_API_KEY:
    WHATSAPP_APP_SECRET:
    WHATSAPP_VERIFY_TOKEN:
    WHATSAPP_ACCESS_TOKEN:
    WHATSAPP_PHONE_NUMBER_ID:
    INSTAGRAM_APP_SECRET:
    INSTAGRAM_VERIFY_TOKEN:
    INSTAGRAM_ACCESS_TOKEN:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_SERVICE_NAME: commerce-agents
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-job: &job
  <<: *app
  restart: "no"
  healthcheck:
    disable: true

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v26.1.20
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Cria os tópicos com KAFKA_PARTITIONS partições; se já existirem com menos, acrescenta.
  topics:
    image: redpandadata/redpanda:v26.1.20
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    environment:
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    command:
      - |
        set -euo pipefail
        rpk() { command rpk "$$@" -X brokers=redpanda:9092; }
        for topic in inbound.messages outbound.messages handoff.events; do
          if rpk topic describe "$$topic" > /dev/null 2>&1; then
            current=$$(rpk topic describe "$$topic" -p | tail -n +2 | grep -c .)
            if [ "$$current" -lt "$$KAFKA_PARTITIONS" ]; then
              rpk topic add-partitions "$$topic" --num $$((KAFKA_PARTITIONS - current))
            fi
          else
            rpk topic create "$$topic" -p "$$KAFKA_PARTITIONS" -r 1
          fi
        done
        rpk topic list
    depends_on:
      redpanda:
        condition: service_healthy

  migrate:
    <<: *job
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *job
    command: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  mock-store:
    <<: *app
    command: ["mock-store"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/orders/O000001', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      API_WORKERS: ${API_WORKERS:-2}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker", "all"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    healthcheck:
      disable: true
    depends_on:
      seed:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      mock-store:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    command: ["--config=file:/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=file:/etc/otelcol-contrib/config.yaml",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: UTC
    ports:
      - "${JAEGER_HOST_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  redpanda-data:
  prometheus-data:
  grafana-data:

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-agents"
version = "0.1.0"
description = "Sistema multi-agente de atendimento e vendas omnichannel (MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
]

[dependency-groups]
dev = [
  "commitizen>=3.31",
  "detect-secrets>=1.5",
  "fastapi>=0.115",
  "httpx>=0.28",
  "hypothesis>=6.0",
  "import-linter>=2.0",
  "mypy==1.13.0",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pyyaml>=6.0",
  "ruff==0.8.4",
  "uvicorn>=0.32",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_agents"]

[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema = "<tipo>(<escopo>): <assunto>"
schema_pattern = '(?s)(build|bump|chore|ci|data|docs|feat|fix|perf|refactor|revert|style|test)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'
example = "feat: nova funcionalidade"
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{subject}}\n\n{{body}}\n\n{{footer}}"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "mock_store", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "mock_store", "data"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config --cov=commerce_agents --cov-branch --cov-report=term-missing"
markers = [
  "unit: testes rápidos e isolados",
  "integration: testes com infraestrutura local",
  "contract: testes de contrato entre camadas/adapters",
  "e2e: testes de ponta a ponta",
]

[tool.coverage.run]
branch = true
source = ["commerce_agents"]

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_packages = ["commerce_agents", "mock_store"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: interfaces > infrastructure > application > domain"
type = "layers"
layers = [
  "commerce_agents.interfaces",
  "commerce_agents.infrastructure",
  "commerce_agents.application",
  "commerce_agents.domain",
]

[[tool.importlinter.contracts]]
name = "mock_store independente da aplicacao"
type = "forbidden"
source_modules = ["mock_store"]
forbidden_modules = ["commerce_agents"]

[[tool.importlinter.contracts]]
name = "Domain independente de frameworks e I/O"
type = "forbidden"
source_modules = ["commerce_agents.domain"]
forbidden_modules = [
  "pydantic",
  "sqlalchemy",
  "fastapi",
  "langgraph",
  "redis",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "Application sem frameworks de infraestrutura"
type = "forbidden"
source_modules = ["commerce_agents.application"]
forbidden_modules = [
  "sqlalchemy",
  "fastapi",
  "langgraph",
  "redis",
  "httpx",
]

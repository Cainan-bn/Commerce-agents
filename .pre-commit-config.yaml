default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        entry: mypy --strict src data
        pass_filenames: false
        additional_dependencies: [pydantic>=2.0, sqlalchemy>=2.0, alembic>=1.14, "httpx>=0.28", "mcp>=1.2,<2", "pgvector>=0.5.1", "fastembed>=0.9.1", "langgraph>=1.0", "langgraph-checkpoint-postgres>=3.0", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "aiokafka>=0.11", "fastapi>=0.115"]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^uv\.lock$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.31.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

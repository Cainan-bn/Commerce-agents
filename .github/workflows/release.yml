name: Release

# Publica a imagem no GHCR (ADR 0020): build multi-stage com cache, varredura Trivy (falha em
# CRITICAL com correção disponível) e push com tags semver e sha. Só na tag v* ou manualmente.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SCAN_TAG: commerce-agents:scan
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  image:
    name: Imagem no GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadados da imagem (tags semver e sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/commerce-agents
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build para varredura (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.SCAN_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (CRITICAL com correção disponível falha o release)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$SCAN_TAG"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (camadas reaproveitadas do cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

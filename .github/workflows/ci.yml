name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e arquitetura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar uv (com cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --frozen

      - name: Rodar lint
        run: make lint

  unit:
    name: Testes unitarios
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar uv (com cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --frozen

      - name: Rodar testes unitarios
        run: make test-unit

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: warn

  eval-gate:
    name: Gate de avaliacao (replay)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar uv (com cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --frozen

      # Replay do cassete gravado (ADR 0016): sem Docker, sem rede de LLM, sem segredos.
      - name: Rodar gate de avaliacao
        run: make eval-ci

  integration:
    name: Testes de integracao
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar uv (com cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --frozen

      - name: Rodar testes de integracao
        run: make test-integration

  build:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # Mesmo build do release (ADR 0020), com cache e sem push.
      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: commerce-agents:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (CRITICAL com correção disponível falha o PR)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            commerce-agents:local
